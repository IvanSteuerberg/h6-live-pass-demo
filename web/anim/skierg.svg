<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="SkiErg">
<style>
.sk-a,.sk-w,.sk-c{animation-duration:2.2s;animation-iteration-count:infinite;animation-timing-function:ease-in-out}
.sk-c{animation-timing-function:linear}
.sk-hip{animation-name:sk-hip}
.sk-tor{animation-name:sk-tor;transform-origin:90px 76px}
.sk-arm{animation-name:sk-arm;transform-origin:90px 44px}
.sk-fore{animation-name:sk-fore;transform-origin:90px 61px}
.sk-thigh{animation-name:sk-thigh;transform-origin:90px 76px}
.sk-shin{animation-name:sk-shin;transform-origin:90px 100px}
.sk-cab{animation-name:sk-cab;d:path("M150 12L107 14.6")}
.sk-fly{animation-name:sk-fly;transform-origin:150px 104px}
@keyframes sk-hip{0%,100%{transform:translate(0,0)}45%{transform:translate(-10px,10px)}}
@keyframes sk-tor{0%,100%{transform:rotate(0)}45%{transform:rotate(35deg)}}
