@keyframes sk-shin{0%,100%{transform:rotate(23.2deg)}45%{transform:rotate(71.9deg)}}
@keyframes sk-fly{0%{transform:rotate(0)}45%{transform:rotate(270deg)}100%{transform:rotate(360deg)}}
@keyframes sk-cab{
