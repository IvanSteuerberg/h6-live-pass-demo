<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 140" width="200" height="140" role="img" aria-label="Empuje de trineo">
<style>
.sl-th{transform-origin:66px 74px;animation:sl-thigh 1.4s ease-in-out infinite}
.sl-sh{transform-origin:66px 96px;animation:sl-shin 1.4s ease-in-out infinite}
.sl-b,.sl-b .sl-sh{animation-delay:-.7s}
.sl-b{opacity:.7}
.sl-push{animation:sl-push .7s ease-in-out infinite}
.sl-lean{transform-origin:66px 74px;animation:sl-lean .7s ease-in-out infinite}
.sl-ground{animation:sl-scroll 1.4s linear infinite}
.sl-fx{animation:sl-fx .7s ease-out infinite}
@keyframes sl-thigh{0%{transform:rotate(-30deg)}50%{transform:rotate(25deg)}100%{transform:rotate(-30deg)}}
@keyframes sl-shin{0%{transform:rotate(60deg)}30%{transform:rotate(8deg)}50%{transform:rotate(0deg)}75%{transform:rotate(85deg)}100%{transform:rotate(60deg)}}
@keyframes sl-push{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes sl-lean{0%,100%{transform:rotate(0deg)}50%{transform:rotate(-3deg)}}
@keyframes sl-scroll{from{transform:translateX(0)}to{transform:translateX(-40px)}}
@keyframes sl-fx{0%{opacity:0;transform:translateX(6px)}30%{opacity:1}100%{opacity:0;transform:translateX(-10px)}}
@media (prefers-reduced-motion:reduce){*{animation-play-state:paused!important}}
</style>
<line x1="0" y1="122" x2="200" y2="122" stroke="#3a414d" stroke-width="2"/>
<g class="sl-ground"><line x1="0" y1="132" x2="280" y2="132" stroke="#3a414d" stroke-width="2" stroke-dasharray="14 26" stroke-linecap="round"/></g>
<g class="sl-fx" stroke="#39ff88" stroke-width="2.5" stroke-linecap="round"><line x1="24" y1="62" x2="40" y2="62"/><line x1="18" y1="76" x2="38" y2="76"/></g>
<g class="sl-push">
<g stroke="#ff9f1c" stroke-linecap="round" fill="none">
<line x1="108" y1="118" x2="152" y2="118" stroke-width="5"/>
<line x1="114" y1="104" x2="114" y2="118" stroke-width="4"/>
<line x1="146" y1="104" x2="146" y2="118" stroke-width="4"/>
<line x1="112" y1="104" x2="150" y2="104" stroke-width="5"/>
<line x1="118" y1="50" x2="118" y2="104" stroke-width="4"/>
<line x1="127" y1="50" x2="127" y2="104" stroke-width="4"/>
</g>
<g fill="#ff9f1c"><rect x="134" y="82" width="4" height="22" rx="1.5"/><rect x="139" y="82" width="4" height="22" rx="1.5"/><rect x="144" y="82" width="4" height="22" rx="1.5"/></g>
<g stroke="#e2e8f0" stroke-linecap="round" fill="none">
<g class="sl-th sl-b" stroke-width="8"><line x1="66" y1="74" x2="66" y2="96"/><g class="sl-sh"><line x1="66" y1="96" x2="66" y2="118"/></g></g>
<g class="sl-th sl-a" stroke-width="8"><line x1="66" y1="74" x2="66" y2="96"/><g class="sl-sh"><line x1="66" y1="96" x2="66" y2="118"/></g></g>
<g class="sl-lean">
<line x1="66" y1="74" x2="90" y2="50" stroke-width="11"/>
<line x1="90" y1="50" x2="118" y2="56" stroke-width="7"/>
<circle cx="98" cy="39" r="6.5" fill="#e2e8f0" stroke="none"/>
</g>
</g>
</g>
</svg>
